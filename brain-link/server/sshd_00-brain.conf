# brain-link kit 2.1 — вход только по ключам. harden.sh кладёт файл как
# /etc/ssh/sshd_config.d/00-brain.conf.disabled и НЕ включает. Включает только
# `brain-link lockdown` после зелёного verify: переименование → sshd -t → проверка
# нового входа по ключу из второго окна → иначе автооткат.
# Префикс 00- важен: в sshd действует первое значение, а облачные образы кладут
# 50-cloud-init.conf с PasswordAuthentication yes. Порт не меняем, белого списка IP нет.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
