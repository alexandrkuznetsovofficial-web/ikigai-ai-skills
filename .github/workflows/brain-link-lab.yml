name: brain-link lab

# Лаборатория связки brain-link вместо тестового VPS и Windows-машины (kit 2.1).
# Ничего наружу не ходит, секретов репозитория не использует; «сервер участника» эмулируется на раннере.
on:
  push:
    branches: ["kit-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-link-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # 1 — юнит-тесты и смоук на трёх ОС × двух версиях Python
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unittest brain-link
        run: python -m unittest discover -s brain-link/tests -v
      - name: check_kit
        run: python tools/check_kit.py
      - name: smoke JSON под cp1251 (только Windows)
        if: runner.os == 'Windows'
        run: |
          python brain-link/ci/smoke_json.py --fake-home --with-access \
            --env PYTHONIOENCODING=cp1251 --expect-rc 0,4 -- \
            python brain-link/scripts/brain_sync.py status
          python brain-link/ci/smoke_json.py --fake-home --with-access \
            --env PYTHONIOENCODING=cp1251 --expect-rc 0,4 -- \
            python brain-link/scripts/brain_link.py detect

  # 2 — расписание на реальном Планировщике задач Windows (PowerShell 5.1), транспорт local
  windows-integration:
    name: windows-integration
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: расписание + probe + audit (Windows PowerShell 5.1)
        shell: powershell
        env:
          WORK: ${{ runner.temp }}\brain-lab
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File brain-link\ci\win_integration.ps1
      - name: keys по паролю через SSH_ASKPASS (askpass.cmd + встроенный ssh.exe, локальный sshd Windows)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          WORK: ${{ runner.temp }}\brain-lab
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File brain-link\ci\win_askpass.ps1
      - name: буфер обмена Windows для put-token claude (clip / Get-Clipboard, функции продукта)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python brain-link/ci/win_clipboard.py
      - name: артефакт (журнал Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-logs
          path: ${{ runner.temp }}\brain-lab\**\*.log
          if-no-files-found: ignore
          retention-days: 7

  # 3 — расписание на реальном launchd macOS, транспорт local
  macos-integration:
    name: macos-integration
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: расписание launchd (local transport)
        env:
          WORK: ${{ runner.temp }}/brain-lab
        run: bash brain-link/ci/mac_integration.sh

  # 4 — e2e по «серверу участника» на 127.0.0.1:2222 + защитные регресс-проверки RT-6…RT-16
  server-e2e:
    name: server-e2e + security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: рабочая папка лаборатории
        run: echo "WORK=$RUNNER_TEMP/brain-lab" >> "$GITHUB_ENV"
      - name: e2e установщика против локального sshd:2222
        run: bash brain-link/ci/server_e2e.sh
      - name: защитные регресс-проверки (RT-6…RT-16)
        # идут и при частичном провале e2e: каждая RT-проверка самостоятельна (без сервера — ранний выход)
        if: ${{ !cancelled() }}
        run: bash brain-link/ci/security_checks.sh
      - name: очистка артефактов от секретов
        if: always()
        run: |
          set -u
          OUT="$WORK/artifacts"; mkdir -p "$OUT"
          # токены, что лаборатория сгенерировала сама (точные значения вычищаем из логов)
          REDACT=()
          for f in "$WORK/tok_claude" "$WORK/tok_bot" "$WORK/tok_rootpw"; do
            [ -f "$f" ] && REDACT+=("$(cat "$f")")
          done
          scrub() { # файл -> в OUT с заменой точных токенов и похожих паттернов
            local src="$1" dst="$OUT/$(basename "$1")"
            cp "$src" "$dst" 2>/dev/null || return 0
            for v in "${REDACT[@]:-}"; do [ -n "$v" ] && sed -i "s#$(printf '%s' "$v" | sed 's/[&/\]/\\&/g')#<redacted>#g" "$dst"; done
            # на всякий случай — любые строки, похожие на токены
            sed -i -E 's#sk-ant-[A-Za-z0-9_-]{10,}#<redacted-anthropic>#g; s#[0-9]{8,10}:[A-Za-z0-9_-]{30,}#<redacted-tg>#g' "$dst"
          }
          for f in "$WORK"/*.log "$WORK"/*.json; do [ -f "$f" ] && scrub "$f"; done
          # удаляем сами файлы токенов и ключи из набора артефактов
          rm -f "$OUT/tok_claude" "$OUT/tok_bot" "$OUT/tok_rootpw" 2>/dev/null || true
          # контроль: в артефактах не осталось ни одного сгенерированного токена
          bad=0
          for v in "${REDACT[@]:-}"; do
            [ -n "$v" ] || continue
            if grep -rqF "$v" "$OUT" 2>/dev/null; then echo "СТОП: токен остался в артефактах"; bad=1; fi
          done
          [ "$bad" = 0 ] && echo "артефакты очищены от секретов" || exit 1
      - name: артефакт (очищенные логи e2e и redteam)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-e2e-logs
          path: ${{ runner.temp }}/brain-lab/artifacts
          if-no-files-found: ignore
          retention-days: 7

  # 5 — kit 2.3: апгрейд уже настроенного сервера (чужой brain-bot, токен старого бота, 60-cloudimg с паролем)
  #     и НАСТОЯЩИЙ lockdown с проверкой sshd -T. После lockdown root закрыт — RT-проверки здесь не идут.
  server-upgrade:
    name: server-upgrade (старый сервер → связка, lockdown)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: рабочая папка лаборатории
        run: echo "WORK=$RUNNER_TEMP/brain-lab" >> "$GITHUB_ENV"
      - name: апгрейд «старого» сервера против локального sshd:2222
        env:
          SCENARIO: upgrade
        run: bash brain-link/ci/server_e2e.sh
      - name: очистка артефактов от секретов
        if: always()
        run: |
          set -u
          OUT="$WORK/artifacts"; mkdir -p "$OUT"
          # токены, что лаборатория сгенерировала сама (точные значения вычищаем из логов)
          REDACT=()
          for f in "$WORK/tok_claude" "$WORK/tok_bot" "$WORK/tok_rootpw"; do
            [ -f "$f" ] && REDACT+=("$(cat "$f")")
          done
          scrub() { # файл -> в OUT с заменой точных токенов и похожих паттернов
            local src="$1" dst="$OUT/$(basename "$1")"
            cp "$src" "$dst" 2>/dev/null || return 0
            for v in "${REDACT[@]:-}"; do [ -n "$v" ] && sed -i "s#$(printf '%s' "$v" | sed 's/[&/\]/\\&/g')#<redacted>#g" "$dst"; done
            # на всякий случай — любые строки, похожие на токены
            sed -i -E 's#sk-ant-[A-Za-z0-9_-]{10,}#<redacted-anthropic>#g; s#[0-9]{8,10}:[A-Za-z0-9_-]{30,}#<redacted-tg>#g' "$dst"
          }
          for f in "$WORK"/*.log "$WORK"/*.json; do [ -f "$f" ] && scrub "$f"; done
          # удаляем сами файлы токенов и ключи из набора артефактов
          rm -f "$OUT/tok_claude" "$OUT/tok_bot" "$OUT/tok_rootpw" 2>/dev/null || true
          # контроль: в артефактах не осталось ни одного сгенерированного токена
          bad=0
          for v in "${REDACT[@]:-}"; do
            [ -n "$v" ] || continue
            if grep -rqF "$v" "$OUT" 2>/dev/null; then echo "СТОП: токен остался в артефактах"; bad=1; fi
          done
          [ "$bad" = 0 ] && echo "артефакты очищены от секретов" || exit 1
      - name: артефакт (очищенные логи e2e и redteam)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-upgrade-logs
          path: ${{ runner.temp }}/brain-lab/artifacts
          if-no-files-found: ignore
          retention-days: 7

  # kit 2.5 — голос бота: настоящий список пакетов (до 2.5 pip сам брал свежие зависимости, и голос ломался:
  # нет requests, av 19). Единственный job, которому нужен PyPI; сервер участника не эмулирует.
  voice-deps:
    name: voice-deps (requirements-voice.txt, py3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: venv теми же флагами, что brain-admin voice-venv
        run: |
          python -I -m venv "$RUNNER_TEMP/vv"
          PIP_NO_INPUT=1 PIP_DISABLE_PIP_VERSION_CHECK=1 "$RUNNER_TEMP/vv/bin/python" -I -m pip install -q \
            --no-cache-dir --only-binary=:all: -r brain-link/server/requirements-voice.txt
      - name: pip check и дрейф (pip freeze ⊆ requirements-voice.txt)
        run: |
          V="$RUNNER_TEMP/vv/bin/python"
          "$V" -m pip check
          norm() { tr 'A-Z_' 'a-z-' | sed 's/==.*//'; }
          grep -vE '^\s*(#|$)' brain-link/server/requirements-voice.txt | norm | sort -u > "$RUNNER_TEMP/want"
          "$V" -m pip freeze --all | grep -vE '^(pip|wheel)==' | norm | sort -u > "$RUNNER_TEMP/have"
          echo "--- pip freeze:"; "$V" -m pip freeze --all
          extra=$(comm -13 "$RUNNER_TEMP/want" "$RUNNER_TEMP/have")
          if [ -n "$extra" ]; then echo "СТОП: pip дотянул незакреплённое: $extra"; exit 1; fi
          echo "всё закреплено"
      - name: импорт, как у бота
        run: |
          "$RUNNER_TEMP/vv/bin/python" -I -c "import requests, av, huggingface_hub, ctranslate2, tokenizers, onnxruntime; from faster_whisper import WhisperModel; print('импорт ok')"
      - name: ogg/opus без расширения → decode_audio (место, где падал av 19)
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null 2>&1 || true
          F="$RUNNER_TEMP/in_1700000000000"
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=2" -ac 1 -ar 48000 -c:a libopus -f ogg "$F"
          "$RUNNER_TEMP/vv/bin/python" -I - "$F" <<'PY'
          import sys
          from faster_whisper.audio import decode_audio
          a = decode_audio(sys.argv[1])
          assert str(a.dtype) == "float32", a.dtype
          assert 28000 < len(a) < 36000, len(a)
          print("decode ok:", len(a), "отсчётов")
          PY
      - name: модель tiny (путь скачивания модели через huggingface_hub и requests)
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache" HF_HOME="$RUNNER_TEMP/cache/hf"
          "$RUNNER_TEMP/vv/bin/python" -I - "$RUNNER_TEMP/in_1700000000000" <<'PY'
          import sys
          from faster_whisper import WhisperModel
          m = WhisperModel("tiny", device="cpu", compute_type="int8")
          segs, info = m.transcribe(sys.argv[1], language="ru", condition_on_previous_text=False, vad_filter=True)
          print("transcribe ok:", repr(" ".join(s.text for s in segs)), info.duration)
          PY
